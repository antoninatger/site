# Galerie « En intervention », en bas de la page Interventions (/interventions/#en-intervention).
#
# AJOUTER DES PHOTOS
#   1. Déposez les photos (jpg, png ou webp, même très lourdes) dans le dossier « galerie-a-ajouter »
#      (dans le dossier site, à côté de celui-ci).
#   2. Lancez « 2 - Construire le site » : chaque photo est réduite automatiquement
#      et ajoutée EN TÊTE de la liste ci-dessous, avec une légende vide.
#   3. Écrivez sa légende (et le nom du photographe dans « credit » si vous le connaissez),
#      puis reconstruisez. Une photo sans légende n'est pas affichée : c'est le moment
#      de vérifier qu'aucun visage d'élève n'est reconnaissable.
#   Vous pouvez ensuite supprimer la photo d'origine du dossier « galerie-a-ajouter ».
#
# RETIRER OU DÉPLACER UNE PHOTO : supprimez ou déplacez ses trois lignes (fichier, legende, credit).
# Les photos s'affichent dans l'ordre de cette liste.

