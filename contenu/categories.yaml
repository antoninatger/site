# Catégories du blog : quatre catégories lisibles à la place des quatorze de WordPress.
# · correspondance : ancienne catégorie WordPress → nouvelle (vide = ignorée)
# · surcharges     : slug d'un billet → liste de catégories, quand la correspondance ne suffit pas
# · par_defaut     : pour les billets sans catégorie (les « Uncategorized » de 2025-2026 sont des analyses)
# · pilier          : la couleur de la catégorie et de ses billets (chercheur, intervenant, romancier)
# Pour changer la catégorie d'un billet : ajouter une ligne dans surcharges, ou modifier `categories:` dans son fichier.

par_defaut: Esprit critique

categories:
  Esprit critique:
    slug: esprit-critique
    pilier: chercheur
    ordre: 1
    description: "Fake news, complotisme, rhétorique, influence : des analyses courtes sur l'actualité, avec les outils de la psychologie."
  Actualités:
    slug: actualites
    pilier: intervenant
    ordre: 2
    description: "Les rencontres, les conférences, les nouveaux jeux, les parutions : la vie des interventions."
  Conseils d'écriture:
    slug: conseils-d-ecriture
    pilier: romancier
    ordre: 3
    description: "Histoire d'écrire : les techniques de l'écriture de fiction, épisode par épisode, et les coulisses du métier."
  Écrits:
    slug: ecrits
    pilier: romancier
    ordre: 4
    description: "Nouvelles, poèmes, textes courts publiés ici depuis 2012."

correspondance:
