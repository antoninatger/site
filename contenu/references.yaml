temoignages:
  - texte: "Excellente intervention, parfaitement limpide, structurée, et essentielle pour les élèves qui, bien souvent, manquent cruellement d'esprit critique face aux sources d'informations auxquelles ils sont confrontés sur les réseaux sociaux. J'ai été particulièrement sensible à la distinction faite entre corrélation et causalité."
    auteur: Samuel B.
    fonction: enseignant, lycée Charles de Gaulle
    intervention: fake-news-et-esprit-critique
  - texte: "Comment développer en six séances de 40 minutes l'esprit critique d'élèves de CM1-CM2 face à l'information en ligne, sur le temps périscolaire du midi ? Défi relevé, grâce à une méthodologie minutieuse et un parcours pédagogique adapté. Les jeux créés par Antonin au fil des séances transforment les enfants en véritables enquêteurs. Merci Antonin pour ta bienveillance et ton professionnalisme."
    auteur: Agnès P.
    fonction: ALAE Georges Dagneaux, Léo Lagrange, Perpignan
    intervention: parcours
  - texte: "Une visio intéressante, interactive sur un sujet hautement d'actualité dont l'objectif est d'interpeller nos étudiants, soumis à des fake news en continu. Une façon pédagogique de développer leur esprit critique."
    auteur: Orianne Capésius
    fonction: enseignante en BTS, lycée Félix Mayer, Creutzwald
    mode: Distanciel
    intervention: a-distance

