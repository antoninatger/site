# Thèmes des chroniques (page /chroniques/).
# · themes : la liste des filtres, dans l'ordre d'affichage.
# · billets : slug du billet → ses thèmes (par leur clé). Classement fait à la main en septembre 2026.
# Pour un nouveau billet, le plus simple est d'écrire dans son en-tête :  themes: [complotisme, rhetorique]
# (les clés sont celles ci-dessous). Un billet sans thème n'apparaît pas dans les chroniques.

themes:
  complotisme:
    nom: Complotisme
    description: "Théories du complot, vrais complots et accusations complotistes."
  rhetorique:
    nom: Rhétorique
    description: "Procédés de discours, sophismes, éléments de langage."
  biais:
    nom: Biais et cerveau
    description: "Biais cognitifs, perception, mémoire : quand notre cerveau nous trompe."
  cadrage:
    nom: Effet de cadrage
    description: "Une même réalité, présentée autrement : contexte, question, montage."
  desinformation:
    nom: Désinformation
    description: "Fake news, fausses images, mésinformation et désinformation."
  reseaux:
    nom: Réseaux sociaux et IA
    description: "Algorithmes, plateformes, intelligence artificielle, adolescents en ligne."
  racisme:
    nom: Racisme et antisémitisme
    description: "Discours de haine, dog whistles, stigmatisation."
  politique:
    nom: Politique
    description: "Campagnes, partis, élus : l'esprit critique appliqué au débat public."
  geopolitique:
    nom: Ingérences et géopolitique
    description: "Russie, guerre informationnelle, influences étrangères."
  fiction:
    nom: Fiction et réel
    description: "Films, livres, documentaires : ce que les œuvres font au réel."
  science:
    nom: Science et pseudo-sciences
    description: "Charlatans, études douteuses, rapport des complotistes à la science."
  emprise:
    nom: Emprise et harcèlement
    description: "Dérives sectaires, relations d'emprise, harcèlement."
  videos:
    nom: Émissions et interviews
    description: "Vidéos, podcasts et interviews auxquels j'ai participé."

