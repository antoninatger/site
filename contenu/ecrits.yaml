      - le-marinier
      - le-reve-americain
      - letincelle_micro-nouvelle
  - cle: poemes
    titre: Poèmes
    intro: "Des poèmes d'annonce, d'atelier et de salon du livre."
    pages: [poemes-doccasion]
    billets:
      - eclat-ons-nous-a-ecrire-un-poeme
      - weekend-decrivain-le-salon-de-montreuil
  - cle: humeurs
    titre: Humeurs
    intro: "Des textes plus libres, sur l'écriture et la culture."
    billets:
      - recette-de-lecrivain-maudit
      - best-of-de-lecrivain-maudit
      - la-nudite-a-lecran
