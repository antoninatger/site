<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Fausses conversations · Jeux et ressources pédagogiques</title>
<meta name="description" content="Créer une fausse conversation pour la classe, sur une seule page : WhatsApp, SMS, messages Instagram, X (Twitter), Facebook ou profil Instagram. Image à télécharger ou lecture animée, message par message.">
<link rel="canonical" href="https://antoninatger.com/jeux/fausses-conversations/creer/">
<link rel="icon" href="/static/img/favicon.svg">
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#1d1b18;--doux:#6b665d;--bord:#e2ddd2;--acc:#1f6f5c;--acc2:#e9f3ef}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--panel:#201e19;--ink:#f1ede4;--doux:#a8a196;--bord:#38352d;--acc:#5cc4a6;--acc2:#1f3530}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.haut{background:var(--panel);border-bottom:1px solid var(--bord);flex:none;position:relative;z-index:20}
.l1{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.l1 h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 a.retour{color:var(--acc);font-size:13.5px;text-decoration:none;white-space:nowrap;border:1px solid var(--bord);border-radius:8px;padding:5px 9px}
.btn{border:1px solid var(--bord);background:var(--panel);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#reglBtn{display:none}
.plats{display:flex;gap:6px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.plats::-webkit-scrollbar{display:none}
.plat{display:flex;align-items:center;gap:7px;border:1px solid var(--bord);background:var(--bg);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;white-space:nowrap;font-size:13.5px;flex:none}
.plat:hover{border-color:var(--acc)}
.plat[aria-selected=true]{background:var(--acc2);border-color:var(--acc);font-weight:600}
.plat i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 system-ui,sans-serif;font-style:normal;flex:none}
.plat small{color:var(--doux);font-weight:400;font-size:12px}
.sep{width:1px;background:var(--bord);margin:3px 4px;flex:none}
.zone{flex:1;position:relative;min-height:0}
.zone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.charge{position:absolute;inset:0;display:grid;place-items:center;color:var(--doux);font-size:14px}
@media (max-width:820px){ #reglBtn{display:inline-block} }
@media (max-width:480px){
  .l1{padding:8px 10px 4px}
  .l1 a.retour{font-size:12.5px;padding:4px 7px}
  .l1 h1{display:none}
  .l1 .btn:first-of-type{margin-left:auto}
  .lg{display:none}
  .plats{padding:4px 10px 8px}
  .plat small{display:none}
  .plat[data-p=insta] small,.plat[data-p=profil] small{display:inline}
  .plat[data-p=x] small,.plat[data-p=facebook] small{display:none}
}
</style>
</head>
<body>
<header class="haut">
  <div class="l1">
    <a class="retour" href="https://antoninatger.com/jeux/fausses-conversations/" title="Retour sur antoninatger.com">← antoninatger.com</a>
    <h1>Fausses conversations</h1>
    <button class="btn" id="annuler" title="Annuler (Ctrl+Z)" disabled>↶<span class="lg"> Annuler</span></button>
    <button class="btn" id="reglBtn">⚙ Réglages</button>
    <button class="btn" type="button" onclick="window.PartageJeux&&PartageJeux.ouvrir('partage')" title="Faire connaître l’outil ou donner votre avis">📣<span class="lg"> Partager</span></button>
  </div>
  <nav class="plats" role="tablist" aria-label="Choisir l’application">
    <button class="plat" role="tab" data-p="whatsapp"><i style="background:#25d366">✆</i>WhatsApp</button>
    <button class="plat" role="tab" data-p="sms"><i style="background:#0a84ff">✉</i>SMS <small>iPhone</small></button>
    <button class="plat" role="tab" data-p="insta"><i style="background:linear-gradient(45deg,#f9a825,#e91e63 55%,#8e24aa)">✈</i>Instagram <small>messages</small></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="plat" role="tab" data-p="x"><i style="background:#000;border:1px solid #444">𝕏</i>X (Twitter) <small>post et réponses</small></button>
    <button class="plat" role="tab" data-p="facebook"><i style="background:#1877f2">f</i>Facebook <small>post et commentaires</small></button>
    <button class="plat" role="tab" data-p="profil"><i style="background:linear-gradient(45deg,#f9a825,#e91e63 55%,#8e24aa)">◎</i>Instagram <small>profil et publication</small></button>
  </nav>
</header>
<main class="zone" id="zone"><div class="charge" id="charge">Chargement…</div></main>

<script>
/* Une seule page pour tous les générateurs de fausses conversations.
   Chaque outil reste une page autonome ; on l'ouvre ici dans un cadre (même site),
   en masquant sa barre du haut : c'est la barre de cette page qui commande Annuler,
   Réglages et Partager. Les cadres déjà ouverts restent en mémoire, on ne perd rien
   en passant d'une application à l'autre. */
const OUTILS = {
  messages: { src: '/jeux/ressources/faux-messages.html' },
  x:        { src: '/jeux/faux-tweets/creer/' },
  facebook: { src: '/jeux/faux-facebook/creer/' },
  profil:   { src: '/jeux/fausse-page-instagram/creer/' },
};
const APPS = { whatsapp: 'messages', sms: 'messages', insta: 'messages' };
const outilDe = p => APPS[p] || p;
const CSS_CADRE = `
  .haut{display:none!important}
  .regl{top:12px!important;max-height:calc(100vh - 24px)!important}
  @media (max-width:820px){ .regl{top:0!important;max-height:none!important} #msgBox{top:12px!important} }`;

const $ = id => document.getElementById(id);
const cadres = {};
let actuel = null, obsAnnuler = null;

function docDe(o){ try{ return cadres[o] && cadres[o].contentDocument; }catch(e){ return null; } }

function preparer(o, f){
  const d = f.contentDocument; if(!d) return;
  const st = d.createElement('style'); st.textContent = CSS_CADRE; d.head.appendChild(st);
  // les liens qui sortent de l'outil s'ouvrent dans la page entière, pas dans le cadre
  d.querySelectorAll('a[href]').forEach(a => { if(!a.target && !a.hasAttribute('download') && !a.getAttribute('href').startsWith('#')) a.target = '_top'; });
  // la vignette d'application choisie dans les réglages de l'outil met à jour la barre du haut
  if(o === 'messages'){
    d.querySelectorAll('#apps [data-app]').forEach(b => b.addEventListener('click', () => setTimeout(() => {
      if(actuel === 'messages') marquer(appMessages() || 'whatsapp');
    }, 0)));
  }
  if(actuel === o) brancher();
}

function appMessages(){
  const d = docDe('messages'); if(!d) return null;
  const b = d.querySelector('#apps [data-app][aria-pressed=true]');
  return b ? b.dataset.app : null;
}

function brancher(){
  // le bouton Annuler de la barre reflète celui de l'outil affiché
  if(obsAnnuler){ obsAnnuler.disconnect(); obsAnnuler = null; }
  const d = docDe(actuel), a = d && d.getElementById('annuler');
  $('annuler').disabled = !a || a.disabled;
  if(a){ obsAnnuler = new MutationObserver(() => { $('annuler').disabled = a.disabled; }); obsAnnuler.observe(a, { attributes: true, attributeFilter: ['disabled'] }); }
}

function marquer(p){
  document.querySelectorAll('.plat').forEach(b => b.setAttribute('aria-selected', b.dataset.p === p));
  try{ localStorage.setItem('fausses-conversations:plateforme', p); }catch(e){}
  history.replaceState(null, '', '#' + p);
  const b = document.querySelector(`.plat[data-p="${p}"]`);
  if(b) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function choisir(p){
  if(!document.querySelector(`.plat[data-p="${p}"]`)) p = 'whatsapp';
  const o = outilDe(p);
  marquer(p);
  if(!cadres[o]){
    const f = document.createElement('iframe');
    f.title = 'Fausses conversations : ' + document.querySelector(`.plat[data-p="${p}"]`).textContent;
    f.allow = 'fullscreen; clipboard-write';
    f.allowFullscreen = true;
    f.addEventListener('load', () => { $('charge').hidden = true; preparer(o, f); if(APPS[p] && actuel === o) choisirApp(attenteApp); });
    f.src = OUTILS[o].src;
    cadres[o] = f; $('zone').appendChild(f);
    $('charge').hidden = false;
  }
  Object.entries(cadres).forEach(([k, f]) => { f.hidden = k !== o; });
  actuel = o;
  if(APPS[p]){ attenteApp = p; if(docDe(o) && docDe(o).readyState === 'complete') choisirApp(p); }
  brancher();
  // un outil qui était caché recalcule sa mise en page
  try{ cadres[o].contentWindow.dispatchEvent(new Event('resize')); }catch(e){}
}

let attenteApp = null;
function choisirApp(p){
  if(!p) return;
  const d = docDe('messages'); if(!d) return;
  const b = d.querySelector(`#apps [data-app="${p}"]`);
  if(b && b.getAttribute('aria-pressed') !== 'true') b.click();
  attenteApp = null;
}

document.querySelectorAll('.plat').forEach(b => b.onclick = () => choisir(b.dataset.p));
$('annuler').onclick = () => { const d = docDe(actuel), a = d && d.getElementById('annuler'); if(a && !a.disabled) a.click(); };
$('reglBtn').onclick = () => { const d = docDe(actuel), r = d && d.getElementById('reglBtn'); if(r) r.click(); };
window.addEventListener('hashchange', () => choisir(location.hash.slice(1)));

let depart = location.hash.slice(1);
if(!depart){ try{ depart = localStorage.getItem('fausses-conversations:plateforme') || ''; }catch(e){} }
choisir(depart || 'whatsapp');
</script>
<script src="https://antoninatger.github.io/jeux/partage.js" defer data-jeu="Fausses conversations" data-flottant="non" data-url="https://antoninatger.com/jeux/fausses-conversations/" data-texte="Fausses conversations : WhatsApp, SMS, Instagram, X, Facebook, un outil gratuit pour créer de faux échanges à projeter en classe"></script>
</body>
</html>
