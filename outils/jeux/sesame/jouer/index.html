<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sésame</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<style>
/* Page d'accueil du jeu en ligne : le temps de charger, puis le jeu la remplace entièrement. */
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(/static/polices/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(/static/polices/space-grotesk-latin-700-normal.woff2) format('woff2')}
:root{color-scheme:light}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:16px;box-sizing:border-box;background:#f4f6f8;color:#14222c;font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;text-align:center}
.carte{max-width:560px;background:#fff;border:1px solid #d3dce3;border-top:5px solid #1b6a8f;border-radius:14px;padding:28px clamp(18px,4vw,36px)}
h1{font-family:'Space Grotesk','Segoe UI',sans-serif;font-size:clamp(28px,5vw,44px);margin:0 0 10px}
p{margin:0 0 12px;line-height:1.55;color:#3d4f5c}
a{color:#1b6a8f}
.rond{width:34px;height:34px;margin:6px auto 14px;border-radius:50%;border:4px solid #e3f1f7;border-top-color:#1b6a8f;animation:t 1s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .rond{animation:none} }
</style>
<div class="carte" id="carte">
  <h1>Sésame</h1>
  <div class="rond" aria-hidden="true"></div>
  <p id="etat">Préparation du jeu…</p>
</div>
<script>
/* Deux façons d'arriver ici :
   #j=…      un lien donné par l'enseignant : tout le jeu (sans photos) est dans l'adresse,
             compressé ; rien n'est envoyé au serveur (ce qui suit # ne quitte jamais le navigateur) ;
   #classe   « Lancer en classe » depuis l'atelier : le jeu, photos comprises, est lu dans le
             navigateur de l'enseignant (la même base que l'atelier).
   Le moteur du jeu est celui de l'atelier, lu dans sa page : un seul moteur à entretenir. */
/* Tout est enfermé dans une fonction : la page du jeu est écrite dans CE document, et le
   moteur déclare ses propres noms (etat, moteur…) qui ne doivent pas déjà exister. */
(() => {
const etat = t => { document.getElementById('etat').innerHTML = t; document.querySelector('.rond')?.remove(); };
const echec = t => etat(t + '<br><br><a href="/jeux/sesame/">Découvrir Sésame</a> · <a href="/jeux/sesame/atelier/">Créer un jeu</a>');

async function moteur(){
  const r = await fetch('/jeux/sesame/atelier/', {cache:'no-cache'});
  if(!r.ok) throw new Error('moteur');
  const m = (await r.text()).match(/<script id="moteur" type="text\/plain">([\s\S]*?)<\/script>/);
  if(!m) throw new Error('moteur');
  return new TextDecoder().decode(Uint8Array.from(atob(m[1].trim()), c => c.charCodeAt(0)));
}
async function depuisLien(code){
  const b64 = code.slice(1).replace(/-/g,'+').replace(/_/g,'/');
  const octets = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), c => c.charCodeAt(0));
  if(code[0] === 'u') return JSON.parse(new TextDecoder().decode(octets));
  const flux = new Blob([octets]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(flux).text());
}
function depuisAtelier(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('atelier-chronophone', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const db = r.result, t = db.transaction('kv', 'readonly'), g = t.objectStore('kv').get('classe');
      g.onsuccess = () => res(g.result || null); g.onerror = () => rej(g.error);
    };
  });
}
(async () => {
  const h = location.hash.slice(1), p = new URLSearchParams(h);
  let jeu = null;
  try{
    if(p.get('j')) jeu = await depuisLien(p.get('j'));
    else if(p.has('classe')){
      for(let k = 0; k < 20 && !jeu; k++){ jeu = await depuisAtelier(); if(!jeu) await new Promise(r => setTimeout(r, 150)); }
      if(!jeu) return echec("Aucun jeu à lancer sur cet ordinateur. Ouvrez l'atelier, préparez votre jeu, puis cliquez « Lancer en classe ».");
    }
    else return echec("Ce lien ne contient pas de jeu. Demandez le bon lien à votre professeur.");
  }catch(e){
    return echec("Ce lien de jeu est incomplet ou abîmé. Vérifiez qu'il a été copié en entier.");
  }
  if(!jeu || !Array.isArray(jeu.items) || !jeu.items.length) return echec("Ce jeu est vide.");
  let m;
  try{ m = await moteur(); }
  catch(e){ return echec("Le jeu n'a pas pu se charger. Vérifiez la connexion internet, puis rechargez la page."); }
  const json = JSON.stringify(jeu).replace(/<\//g,'<\\/').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const page = '<!doctype html>\n<html lang="fr">\n' + m.replace('/*CONFIG*/{}', () => json) + '\n</html>\n';
  document.open(); document.write(page); document.close();
})();
})();
</script>
</html>
