# Formulaires : un service tiers reçoit les envois (le site est statique).
# Créer un formulaire sur formspree.io (gratuit) et coller son adresse ici.
# Mesure d'audience (Cloudflare Web Analytics, sans cookie) : coller ici le jeton donné par Cloudflare.
mesure_audience: ""

admin:
  # Adresse du petit serveur Cloudflare (back-office /admin/ et bouton « Publier » des commentaires).
  # À coller une fois le serveur créé (voir serveur-cloudflare/GUIDE.md), par exemple https://site-antonin.xxxx.workers.dev
  serveur: ""

formulaires:
  # Web3Forms, comme les jeux (même clé) : les messages arrivent dans Outlook.
  # Objets : « [Contact site] … » et « [Liste d'attente formations] … ». Gratuit jusqu'à 250 envois par mois.
  service: https://api.web3forms.com/submit
  cle: "ef1fe549-c616-4a27-a6c2-97f06caa913d"

blog:
  par_page: 12
  # Abonnement par e-mail : la liste reste chez WordPress.com (site amanalat.wordpress.com, identifiant 31556844).
  # Le formulaire envoie l'adresse à subscribe.wordpress.com, qui expédie le mail de confirmation.
  wordpress_id: 31556844
  categories_fichier: contenu/categories.yaml

espace_formations: https://formations.amanalat.workers.dev   # petit rond discret en bas de page (espace protégé par code)
jeux_url: https://antoninatger.github.io/jeux      # à remettre sur https://jeux.antoninatger.com quand Cloudflare sera prêt

# Jeux en accès libre servis sur antoninatger.com/jeux/… (pour le référencement).
# Ils restent écrits dans leurs propres dépôts (antoninatger/jeux, antoninatger/fakemetre) : à chaque
# construction, ces fichiers sont recopiés dans le site. GitHub Actions récupère les dépôts dans _sources/ ;
# en local, construire_site.py les cherche aussi dans les dossiers voisins (..\jeux, ..\fakemetre).
# Les anciennes adresses antoninatger.github.io/… renvoient ici (partage.js, dans le dépôt jeux).
jeux_copies:
  - depot: jeux
    vers: /jeux/
    elements:
      - radarnaque
      - agorateur
      - agora
      - arene-rhetorique
      - Planète connaissance.html
      - planete-connaissance.js
      - planete-connaissance-en.js
      - ressources/faux-messages.html
      - collection.css
      - collection.js
      - i18n.js
      - retours.js
      - partage.js
      - fonts
  - depot: fakemetre
    vers: /jeux/fakemetre/
    exclure: [Vidéos, Instagram posts FR, Instagram posts EN, Nouveau dossier]
