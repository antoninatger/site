{# Petites animations des vignettes de jeux (accueil). Clé = champ « icone » du jeu dans references.yaml. #}
{% macro anim(nom) %}
{% if nom == 'gauge' %}
<svg viewBox="0 0 64 64" class="aj aj--jauge">
  <path d="M12 44a20 20 0 0 1 11-17.9" class="aj-arc aj-rouge"/>
  <path d="M25.6 25.2a20 20 0 0 1 12.8 0" class="aj-arc aj-orange"/>
  <path d="M41 26.1A20 20 0 0 1 52 44" class="aj-arc aj-vert"/>
  <g class="aj-aiguille"><line x1="32" y1="44" x2="32" y2="27"/><circle cx="32" cy="44" r="3.2"/></g>
  <text x="32" y="57" class="aj-texte">fiable ?</text>
</svg>
{% elif nom == 'shield' %}
<svg viewBox="0 0 64 64" class="aj aj--radar">
  <defs><linearGradient id="aj-bal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e74c3c" stop-opacity=".9"/><stop offset="1" stop-color="#e74c3c" stop-opacity="0"/></linearGradient></defs>
  <circle cx="32" cy="32" r="24" class="aj-anneau"/><circle cx="32" cy="32" r="15" class="aj-anneau"/><circle cx="32" cy="32" r="6" class="aj-anneau"/>
  <g class="aj-balayage"><path d="M32 32 L32 8 A24 24 0 0 1 52.8 20 Z" fill="url(#aj-bal)"/></g>
  <circle cx="44" cy="22" r="2.6" class="aj-point aj-p1"/><circle cx="22" cy="41" r="2.6" class="aj-point aj-p2"/><circle cx="41" cy="44" r="2.6" class="aj-point aj-p3"/>
  <text x="44" y="18" class="aj-alerte">!</text>
</svg>
{% elif nom == 'swords' %}
<svg viewBox="0 0 64 64" class="aj aj--bulles">
  <g class="aj-bulle aj-b1"><path d="M8 12h28a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H18l-6 5v-5H8a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z"/><text x="22" y="25">Logos</text></g>
  <g class="aj-bulle aj-b2"><path d="M28 34h28a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-4v5l-6-5H28a4 4 0 0 1-4-4V38a4 4 0 0 1 4-4z"/><text x="42" y="47">Pathos</text></g>
</svg>
{% elif nom == 'planet' %}
<svg viewBox="0 0 64 64" class="aj aj--planete">
  <circle cx="12" cy="14" r="1.2" class="aj-etoile aj-e1"/><circle cx="52" cy="10" r="1" class="aj-etoile aj-e2"/><circle cx="55" cy="50" r="1.3" class="aj-etoile aj-e3"/><circle cx="9" cy="48" r="1" class="aj-etoile aj-e2"/>
  <circle cx="32" cy="32" r="11" class="aj-globe"/>
  <ellipse cx="32" cy="32" rx="19" ry="6" class="aj-anneau-p" transform="rotate(-20 32 32)"/>
  <g class="aj-orbite"><circle cx="32" cy="10" r="3" class="aj-lune"/></g>
</svg>
{% endif %}
{% endmacro %}
