# Construit le site à chaque push sur main et le publie sur GitHub Pages.
# Réglage à faire une fois sur GitHub : Settings → Pages → Source : « GitHub Actions ».
name: Construire et publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Toutes les 15 minutes : les billets programmés depuis le Séquenceur apparaissent
  # à leur date, et les jeux recopiés depuis antoninatger/jeux sont rafraîchis.
  # GitHub saute beaucoup de déclenchements planifiés (un seul passage toutes les
  # 4 à 7 heures avec l'ancien rythme horaire) : en multiplier les créneaux
  # rattrape une partie de ces trous. Le vrai déclencheur reste le dispatch envoyé
  # par le dépôt jeux après chaque mise en ligne (secret SITE_TOKEN).
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jeux en accès libre, recopiés sous antoninatger.com/jeux/… (site.yaml → jeux_copies)
      - uses: actions/checkout@v4
        with:
          repository: antoninatger/jeux
          path: _sources/jeux
      - uses: actions/checkout@v4
        with:
          repository: antoninatger/fakemetre
          path: _sources/fakemetre
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python construire_site.py --verifier
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
