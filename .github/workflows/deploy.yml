# Construit le site à chaque push sur main et le publie sur GitHub Pages.
# Réglage à faire une fois sur GitHub : Settings → Pages → Source : « GitHub Actions ».
name: Construire et publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # chaque heure : les billets programmés depuis le Séquenceur apparaissent à leur date
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python construire_site.py --verifier
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
